<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>

<style>
:root { font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; color-scheme:dark; }
* { box-sizing:border-box; }
body { margin:0; background:#101820; color:#e9f1f2; }
main { max-width:780px; margin:auto; padding:14px 14px 32px; }
.eyebrow { color:#9ed0cf; font-size:.75rem; letter-spacing:.055em; font-weight:650; }
h1 { font-size:1.36rem; margin:6px 0 8px; line-height:1.2; }
h2 { font-size:1.12rem; margin:0 0 8px; }
p { line-height:1.48; }
.muted { color:#b4c3ca; font-size:.9rem; }
.small { font-size:.78rem; }
.progress { display:flex; gap:6px; margin:15px 0 12px; }
.progress span { height:4px; border-radius:10px; background:#43535e; flex:1; }
.progress span.done { background:#a4e4d1; }
.frame { background:#081014; position:relative; overflow:hidden; border-radius:12px; touch-action:pan-y; min-height:185px; }
.frame.zoom { touch-action:none; }
.frame img { display:block; width:100%; height:auto; transform-origin:top left; user-select:none; -webkit-user-drag:none; will-change:transform; }
.frame:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible { outline:3px solid #c0f4dd; outline-offset:2px; }
.error { display:none; background:#48332a; color:#fff0dd; border:1px solid #8e6152; border-radius:10px; padding:12px; margin-top:6px; }
.error.visible { display:block; }
.controls { display:flex; gap:8px; margin:9px 0 0; }
button { cursor:pointer; min-height:46px; border-radius:12px; background:#293c44; border:1px solid #68818a; color:#f0f8f8; padding:9px 12px; font-size:.92rem; }
.controls button { flex:1; }
button.primary { background:#b6e9d8; color:#112b2d; border-color:#b6e9d8; font-weight:750; }
button.ghost { background:transparent; border-color:#526772; }
button[disabled] { opacity:.45; cursor:not-allowed; }
.card { margin-top:15px; background:#1b2a32; border:1px solid #43545e; border-radius:14px; padding:14px; }
.choice { display:block; width:100%; margin:8px 0; text-align:left; font-size:1rem; line-height:1.32; background:#253842; }
.choice[aria-pressed=true] { background:#b6e9d8; color:#112b2d; border-color:#b6e9d8; font-weight:680; }
.choice[aria-pressed=true]::before { content:'✓ '; }
.row { display:flex; flex-wrap:wrap; gap:8px; justify-content:space-between; margin-top:14px; }
.row button { flex:1; }
.justification { width:100%; min-height:78px; padding:12px; background:#101f26; color:#ebf2f5; font:inherit; border:1px solid #637986; border-radius:12px; resize:vertical; }
.notes { background:#203338; border-left:3px solid #9dd6c9; padding:12px; border-radius:8px; font-size:.92rem; }
.meta { margin-top:20px; padding-top:14px; border-top:1px solid #415560; color:#aebcc4; font-size:.76rem; line-height:1.6; }
a { color:#a7e2d2; }
.pill { display:inline-block; background:#34484e; border:1px solid #526a70; padding:4px 8px; border-radius:100px; font-size:.78rem; }
.hidden { display:none !important; }

/* 00A v7: All variants are extracted from one decoded source image.
   One CROP_BOXES rectangle is used by both the displayed crop and its
   original-image outline. The user can choose different aspect ratios. */
.crop-switch{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin:14px 0 10px;min-width:0}
.crop-choice{min-width:0;min-height:52px;padding:9px 5px;border:1px solid #657b87;border-radius:10px;background:#283c47;color:#f1f6f7;font-size:.84rem;line-height:1.18;font-weight:650;overflow-wrap:anywhere}
.crop-choice[aria-pressed="true"]{background:#ace9da;color:#0a292d;border-color:#ace9da}
.crop-frame{position:relative;display:flex;justify-content:center;align-items:center;max-width:100%;width:100%;overflow:hidden;border-radius:12px;background:#071017;border:1px solid #546b75;isolation:isolate}
.crop-frame canvas{display:block;max-width:100%;max-height:min(68svh,650px);width:auto;height:auto;user-select:none}
.crop-tag{position:absolute;bottom:10px;left:10px;background:rgba(9,22,31,.87);color:#fff;padding:5px 9px;border-radius:7px;font-size:.78rem}
.crop-guide-key{font-size:.78rem;color:#beced4;margin:8px 0 0;line-height:1.4}
.crop-guide-key i{display:inline-block;width:15px;height:11px;margin:0 4px 0 10px;border:2px dashed #eee;vertical-align:-1px}
.crop-guide-key i:first-child{margin-left:0}
.crop-guide-key i.art-key{border-color:#f0bd7e}
.crop-error{margin-top:8px;padding:11px;border:1px solid #d8988a;border-radius:8px;color:#ffdcd6;background:#402b33}
.crop-explainer{margin:13px 0;border:1px solid #5c7181;border-radius:12px;padding:12px;background:#1e303c}
.crop-explainer summary{cursor:pointer;font-weight:650}
.crop-explainer p{font-size:.9rem;line-height:1.5}
html,body{max-width:100%;overflow-x:clip}
main,.card,#steps{min-width:0;max-width:100%}

.lang-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 0 12px}
.lang-row label{display:flex;align-items:center;gap:7px;font-size:.82rem;color:#bed7d7}
.lang-row select{background:#273b46;border:1px solid #6d858e;border-radius:8px;color:#f0f8f8;padding:9px;font:inherit;min-height:44px}
.back-link{font-size:.85rem;text-decoration:none}

let locale=qs.get('lang')==='fi'?'fi':qs.get('lang')==='en'?'en':savedLocale()||'en';
const T=()=>D[locale];
function label(key,value){return T().choices[key].find(([v])=>v===value)?.[1]||T().noAnswer;}
function buttons(key){return T().choices[key].map(([v,text])=>`<button type="button" class="choice" data-answer="${key}" data-value="${v}" aria-pressed="${answers[key]===v}">${safe(text)}</button>`).join('');}
function chrome(){
 const d=T();
 document.documentElement.lang=locale;
 document.title=d.title;
 $('langSelect').value=locale;
 $('eyebrow').textContent=d.eyebrow;
 $('heading').textContent=d.heading;
 $('intro').textContent=d.intro;
 $('langLabel').textContent=d.language;
 $('backLink').textContent=d.backLink;
 $('backLink').href='../index.html?lang='+locale;
 frame.setAttribute('aria-label',d.ariaFrame);
 photo.alt=d.photoAlt;
 $('imageError').textContent=d.imageError;
 $('zoomHelp').textContent=d.zoomHelp;
 $('meta').textContent=d.meta;
 renderZoom();
}
function stepButtons(back,forward,labelForward,enabled=true){const d=T();return `<div class="row">${back===null?'':`<button type="button" class="ghost" data-next="${back}">${safe(d.back)}</button>`}<button type="button" class="primary" data-next="${forward}" ${enabled?'':'disabled'}>${safe(labelForward)}</button></div>`;}
function cropHtml(){
 const d=T(),s=d.stages[4];
 return `<span class="pill">${s.badge}</span><h2>${s.title}</h2><p>${s.body}</p>
 <div class="crop-switch" role="group" aria-label="${safe(d.language)}">
 ${Object.entries(d.crops).map(([value,title])=>`<button type="button" class="crop-choice" data-crop="${value}" aria-pressed="${crop===value}">${safe(title)}</button>`).join('')}
 </div>
 <div class="crop-frame" id="cropFrame" role="img"><canvas id="cropPhoto" width="1536" height="1024" role="img"></canvas><span class="crop-tag" id="cropTag"></span></div>
 <p class="crop-guide-key" id="cropLegend"><i></i> ${safe(s.legend)} <i class="art-key"></i></p>
 <p class="crop-error" id="cropError" role="alert" hidden>${safe(d.cropError)}</p>
 <p class="muted small">${s.compareInfo}</p>
 <div class="notes"><strong>${s.questionsTitle}</strong>${s.questions.map(x=>`<p>${safe(x)}</p>`).join('')}</div>
 <details class="crop-explainer"><summary>${s.theoryTitle}</summary>${s.theory.map(x=>`<p>${x}</p>`).join('')}</details>
 <div class="row"><button type="button" class="ghost" data-next="3">${safe(d.backToSummary)}</button><button type="button" class="primary" id="restart">${safe(d.restart)}</button></div>`;
}
function drawGuides(ctx,box,color){
 ctx.save();ctx.strokeStyle='rgba(0,0,0,.68)';ctx.lineWidth=11;ctx.setLineDash([22,13]);
 ctx.strokeRect(box.x+4,box.y+4,box.w-8,box.h-8);
 ctx.strokeStyle=color;ctx.lineWidth=7;
 ctx.strokeRect(box.x+4,box.y+4,box.w-8,box.h-8);ctx.restore();
}
function drawCrop(which){
 const canvas=$('cropPhoto'),tag=$('cropTag'),legend=$('cropLegend'),error=$('cropError');
 if(!canvas)return;
 if(!photo.complete||photo.naturalWidth!==1536||photo.naturalHeight!==1024){error.hidden=false;return;}
 error.hidden=true;
 const box=CROP_BOXES[which], ctx=canvas.getContext('2d');
 canvas.width=box.w;canvas.height=box.h;
 ctx.drawImage(photo,box.x,box.y,box.w,box.h,0,0,box.w,box.h);
 if(which==='whole'){
  drawGuides(ctx,CROP_BOXES.transit,'#f6ffff');
  drawGuides(ctx,CROP_BOXES.art,'#f0bd7e');
 }
 const d=T();tag.textContent=d.crops[which];legend.hidden=which!=='whole';
 $('cropFrame').setAttribute('aria-label',d.cropDescriptions[which]);
 canvas.setAttribute('aria-label',d.cropDescriptions[which]);
 for(const btn of steps.querySelectorAll('[data-crop]'))btn.setAttribute('aria-pressed',String(btn.dataset.crop===which));
}
function renderStep(){
 const d=T(),s=d.stages[stage];
 $('photoShell').classList.toggle('hidden',stage===4);
 for(let i=0;i<5;i++)$('progress'+i).classList.toggle('done',i<=stage);
 let html=`<span class="pill">${s.badge}</span><h2>${s.title}</h2>`;
 if(stage===0)html+=`<p>${s.body}</p>${buttons('focus')}${stepButtons(null,1,d.continue,!!answers.focus)}`;
 if(stage===1)html+=`<p>${s.body}</p>${buttons('poster')}<p class="muted small">${s.note}</p>${stepButtons(0,2,d.continue,!!answers.poster)}`;
 if(stage===2)html+=`<p>${s.body}</p>${buttons('info')}<p>${s.whyQuestion}</p>${buttons('why')}${stepButtons(1,3,d.toReview,!!(answers.info&&answers.why))}`;
 if(stage===3){
  const names=['focus','poster','info','why'];
  html+=names.map((key,i)=>`<p><strong>${s.summaryLabels[i]}:</strong> ${safe(label(key,answers[key]))}.</p>`).join('');
  html+=`<div class="notes"><strong>${s.lessonTitle}:</strong> ${s.lesson}</div><p class="muted">${s.note}</p><div class="row"><button type="button" class="ghost" data-next="2">${safe(d.backToAnswers)}</button><button type="button" class="primary" data-next="4">${safe(d.toCrops)}</button></div>`;
 }
 if(stage===4)html=cropHtml();
 steps.innerHTML=html;
 for(const btn of steps.querySelectorAll('[data-answer]'))btn.addEventListener('click',()=>{answers[btn.dataset.answer]=btn.dataset.value;renderStep();});
 for(const btn of steps.querySelectorAll('[data-next]'))btn.addEventListener('click',()=>{stage=Number(btn.dataset.next);renderStep();});
 if(stage===4){
  for(const btn of steps.querySelectorAll('[data-crop]'))btn.addEventListener('click',()=>{crop=btn.dataset.crop;drawCrop(crop);});
  const restart=$('restart');restart.addEventListener('click',()=>{for(const key of Object.keys(answers))answers[key]='';stage=0;crop='whole';renderStep();});
  if(photo.complete&&photo.naturalWidth)drawCrop(crop); else photo.addEventListener('load',()=>drawCrop(crop),{once:true});
 }
}
$('langSelect').addEventListener('change',()=>{
 locale=$('langSelect').value;
 const url=new URL(location.href);url.searchParams.set('lang',locale);history.replaceState(null,'',url);
 chrome();renderStep();
});
photo.addEventListener('error',()=>$('imageError').classList.add('visible'));
photo.addEventListener('load',()=>$('imageError').classList.remove('visible'));
function clampPosition(){const w=frame.clientWidth,h=frame.clientHeight;tx=clamp(tx,Math.min(0,w*(1-scale)),0);ty=clamp(ty,Math.min(0,h*(1-scale)),0);}
function renderZoom(){clampPosition();photo.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`;frame.classList.toggle('zoom',scale>1.001);zoomBtn.textContent=scale>1.001?T().zoomOut:T().zoomIn;$('reset').textContent=T().zoomOut;zoomBtn.setAttribute('aria-pressed',String(scale>1.001));}
function zoomAt(next,p){const current=scale,s=clamp(next,1,3);tx=p.x-(p.x-tx)*s/current;ty=p.y-(p.y-ty)*s/current;scale=s;if(s===1){tx=0;ty=0;}renderZoom();}
function local(e){const r=frame.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}
function midpoint(a,b){return{x:(a.x+b.x)/2,y:(a.y+b.y)/2};}
function distance(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}
function startPinch(){const[a,b]=[...pointers.values()],mid=midpoint(a,b);pinch={dist:Math.max(1,distance(a,b)),scale,contentX:(mid.x-tx)/scale,contentY:(mid.y-ty)/scale};}
frame.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;e.preventDefault();frame.setPointerCapture(e.pointerId);pointers.set(e.pointerId,local(e));if(pointers.size>=2)startPinch();});
frame.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;const pt=local(e),prev=pointers.get(e.pointerId);pointers.set(e.pointerId,pt);if(pointers.size>=2){if(!pinch)startPinch();const[a,b]=[...pointers.values()],mid=midpoint(a,b);scale=clamp(pinch.scale*distance(a,b)/pinch.dist,1,3);tx=mid.x-pinch.contentX*scale;ty=mid.y-pinch.contentY*scale;}else if(scale>1.001){tx+=pt.x-prev.x;ty+=pt.y-prev.y;}renderZoom();});
function endPointer(e){pointers.delete(e.pointerId);pinch=null;}
for(const ev of ['pointerup','pointercancel','lostpointercapture'])frame.addEventListener(ev,endPointer);
frame.addEventListener('keydown',e=>{const keys={ArrowLeft:[24,0],ArrowRight:[-24,0],ArrowUp:[0,24],ArrowDown:[0,-24]};if(scale>1.001&&keys[e.key]){e.preventDefault();tx+=keys[e.key][0];ty+=keys[e.key][1];renderZoom();}else if(e.key==='Escape'){zoomAt(1,{x:frame.clientWidth/2,y:frame.clientHeight/2});}});
zoomBtn.addEventListener('click',()=>zoomAt(scale>1.001?1:1.8,{x:frame.clientWidth/2,y:frame.clientHeight/2}));
$('reset').addEventListener('click',()=>zoomAt(1,{x:frame.clientWidth/2,y:frame.clientHeight/2}));
window.addEventListener('resize',renderZoom);
chrome();renderStep();
</script>
</body></html>
